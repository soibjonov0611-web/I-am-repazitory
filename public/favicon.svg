      <stop offset="0%" stop-color="#0e1022"/>
      <stop offset="100%" stop-color="#06070e"/>
    </linearGradient>
    <linearGradient id="codeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
